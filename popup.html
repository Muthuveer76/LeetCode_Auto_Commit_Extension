<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LeetCode Auto-Committer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h2>GitHub Config</h2>
  <div class="form-group">
    <label for="username">GitHub Username:</label>
    <input type="text" id="username" placeholder="e.g. octocat">
  </div>
  <div class="form-group">
    <label for="repo">Repository Name:</label>
    <input type="text" id="repo" placeholder="e.g. LeetCode-Solutions">
  </div>
  <div class="form-group">
    <label for="token">Personal Access Token (PAT):</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">
  </div>
  <button id="save">Save</button>
  <button id="test-conn" style="background-color: #0366d6; margin-top: 5px;">Test GitHub Connection</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
